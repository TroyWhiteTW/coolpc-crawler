  <meta name="description" content="選擇任意兩個時間點的快照，比對原價屋（CoolPC）電腦零組件在該期間的漲跌幅度、新上架與下架情況。涵蓋 CPU、顯示卡、SSD、記憶體等全分類，開源免費。">
  <meta name="author" content="TroyWhiteTW">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="canonical" href="https://troywhitetw.github.io/coolpc-crawler/compare.html">

  <meta property="og:type" content="website">
  <meta property="og:title" content="歷史比價工具 — 原價屋價格追蹤">
  <meta property="og:description" content="選擇任意兩個時間點的快照，比對原價屋電腦零組件的漲跌變化。開源免費，每日自動更新。">
  <meta property="og:url" content="https://troywhitetw.github.io/coolpc-crawler/compare.html">

  <meta property="og:site_name" content="原價屋價格追蹤">

  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="歷史比價工具 — 原價屋價格追蹤">
  <meta name="twitter:description" content="選擇任意兩個時間點的快照，比對原價屋電腦零組件的漲跌變化。">
  <meta name="twitter:image" content="https://troywhitetw.github.io/coolpc-crawler/og-image.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pages.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" defer></script>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <a class="header-brand" href="index.html">
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <rect x="2" y="8" width="4" height="18" rx="1" fill="var(--accent)"/>
            <rect x="8" y="4" width="4" height="22" rx="1" fill="var(--accent)" opacity="0.7"/>
            <rect x="14" y="12" width="4" height="14" rx="1" fill="var(--accent)" opacity="0.5"/>
            <rect x="20" y="2" width="4" height="24" rx="1" fill="var(--accent)" opacity="0.85"/>
          </svg>
        </div>
        <div>
          <span class="brand-title">原價屋價格追蹤</span>
          <span class="brand-sub">CoolPC Price Tracker</span>
        </div>
      </a>
      <div class="header-meta" id="headerMeta"></div>
    </div>
  </header>

  <nav class="cat-nav" aria-label="主要導覽">
    <div class="cat-nav-inner">
      <a href="index.html">← 回總覽</a>
      <a href="compare.html" class="active" aria-current="page">歷史比價工具</a>
    </div>
  </nav>

  <div class="tool-intro">
    <h1>原價屋歷史比價工具</h1>
    <p>選擇任意兩個時間點的價格快照，即可比對該期間內所有商品的漲跌幅度、新上架與下架情況。資料每日自動更新 5 次。</p>
  </div>

  <!-- Controls -->
  <section class="controls-bar">
    <div class="controls-inner">
      <div class="selector-group">
        <div class="selector">
          <label class="selector-label">舊 (A)</label>
          <div class="cascading-select">
            <div class="select-wrap">
              <select id="selectA_year"></select>
            </div>
            <div class="select-wrap">
              <select id="selectA_month"></select>
            </div>
            <div class="select-wrap select-wrap-entry">
              <select id="selectA_entry"></select>
            </div>
          </div>
        </div>
        <div class="selector-vs">
          <span>VS</span>
        </div>
        <div class="selector">
          <label class="selector-label">新 (B)</label>
          <div class="cascading-select">
            <div class="select-wrap">
              <select id="selectB_year"></select>
            </div>
            <div class="select-wrap">
              <select id="selectB_month"></select>
            </div>
            <div class="select-wrap select-wrap-entry">
              <select id="selectB_entry"></select>
            </div>
          </div>
        </div>
      </div>
      <button class="btn-compare" id="btnCompare">
        <span class="btn-icon">⟳</span> 比較
      </button>
    </div>
  </section>

  <!-- Loading -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <p>載入資料中…</p>
  </div>

  <!-- Main content -->
  <main class="main-content" id="mainContent" style="display:none;">

    <!-- Stats -->
    <section class="stats-bar">
      <div class="stat-card">
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">總商品數</div>
      </div>
      <div class="stat-card stat-changed">
        <div class="stat-value" id="statChanged">0</div>
        <div class="stat-label">價格異動</div>
      </div>
      <div class="stat-card stat-up">
        <div class="stat-value" id="statUp">0</div>
        <div class="stat-label">漲價</div>
      </div>
      <div class="stat-card stat-down">
        <div class="stat-value" id="statDown">0</div>
        <div class="stat-label">降價</div>
      </div>
      <div class="stat-card stat-new">
        <div class="stat-value" id="statNew">0</div>
        <div class="stat-label">新增</div>
      </div>
      <div class="stat-card stat-removed">
        <div class="stat-value" id="statRemoved">0</div>
        <div class="stat-label">下架</div>
      </div>
    </section>

    <!-- Mode mismatch notice -->
    <div class="mode-notice" id="modeNotice" style="display:none;"></div>

    <!-- View toggle -->
    <section class="view-bar">
      <div class="view-bar-inner">
        <label class="toggle-label toggle-chip">
          <input type="checkbox" id="toggleAll" checked>
          <span class="toggle-switch"></span>
          <span class="toggle-text-full">顯示所有商品（含無異動）</span>
          <span class="toggle-text-short">顯示全部</span>
        </label>
        <label class="toggle-label toggle-chip">
          <span>全部 展開/收合</span>
          <input type="checkbox" id="toggleExpand">
          <span class="toggle-switch"></span>
        </label>
      </div>
    </section>

    <!-- Category groups -->
    <section class="groups-section" id="groupsSection"></section>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p>coolpc-crawler &middot; 資料來源：<a href="https://www.coolpc.com.tw/evaluate.php" target="_blank" rel="noopener nofollow">原價屋線上估價</a> &middot; <a href="https://github.com/TroyWhiteTW/coolpc-crawler" target="_blank" rel="noopener">GitHub</a></p>
    <p class="footer-note">本站為非官方的開源價格記錄工具，與原價屋（欣亞數位）無任何隸屬關係。價格僅供參考，實際售價與供貨狀況請以原價屋官方網站為準。</p>
  </footer>

  <!-- defer 確保 PapaParse 先於 app.js 執行 defer keeps PapaParse ahead of app.js -->
  <script src="app.js" defer></script>

  <!-- Analytics 置於文件尾端，避免阻塞首屏渲染 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4SB0FDBZ1K"></script>

    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4SB0FDBZ1K');
  </script>
</body>
</html>
